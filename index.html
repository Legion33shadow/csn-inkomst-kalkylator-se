    var gain=Math.round(cost*Math.pow(1.07,y));
    html+='<div class="proj-row"><span class="py">'+y+'ans</span>'
      +'<span class="pc">-'+cost.toLocaleString()+unit+'</span>'
      +'<span class="pg">+'+gain.toLocaleString()+unit+' investi</span></div>';
  });
  document.getElementById('proj-body').innerHTML=html;
  document.getElementById('proj').style.display='block';
}
function setStat(id,val){var e=document.getElementById(id);if(e)e.textContent=val;}


function calc(){
  var weeks=parseInt(document.getElementById('weeks').value)||20;
  var income=parseFloat(document.getElementById('income').value)||0;
  var limit=Math.round(137750*weeks/52);
  var over=Math.max(0,income-limit);
  var repay=over>0?Math.round(over*0.5):0;
  var margin=Math.max(0,limit-income);
  var extra=weeks>0?Math.round(margin/weeks*4.33):0;
  setStat('r_limit',  limit.toLocaleString('sv-SE')+' kr');
  setStat('r_margin', margin.toLocaleString('sv-SE')+' kr');
  setStat('r_extra',  extra.toLocaleString('sv-SE')+' kr/v');
  setStat('r_repay',  repay.toLocaleString('sv-SE')+' kr');
  document.getElementById('stats').style.display='grid';
  if(over>0){
    showShock(
      repay.toLocaleString('sv-SE')+' kr',
      'Risk for återkrav',
      'Du har tjänat '+over.toLocaleString('sv-SE')+' kr över gränsen.',
      'bad'
    );
  } else {
    showShock(
      margin.toLocaleString('sv-SE')+' kr',
      'Marginal kvar — du är säker',
      'Du kan tjäna upp till '+extra.toLocaleString('sv-SE')+' kr/vecka till.',
      'good'
    );
  }
}
calc();

</script>
</body></html>
